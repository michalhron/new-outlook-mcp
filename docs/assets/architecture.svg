<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Data flow through the code"><title>Data flow through the code</title><rect width="1200" height="560" fill="#F3EFE3"/><rect x="48" y="39" width="14" height="14" fill="#C15A3D"/><text x="74" y="52" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#8C7B5C" text-anchor="start" letter-spacing="3.5">DATA FLOW</text><text x="46" y="100" font-family="'Source Serif 4','Source Serif Pro',Georgia,serif" font-size="32" font-weight="700" fill="#1F3D57" text-anchor="start" letter-spacing="0">From Outlook's files to a tool answer.</text><line x1="93.0" y1="200.0" x2="210.0" y2="200.0" stroke="#1F3D57" stroke-width="4"/><path d="M210.0 200.0L194.0 190.4L194.0 209.6z" fill="#1F3D57"/><line x1="248.0" y1="200.0" x2="375.0" y2="200.0" stroke="#1F3D57" stroke-width="4"/><path d="M375.0 200.0L359.0 190.4L359.0 209.6z" fill="#1F3D57"/><line x1="413.0" y1="200.0" x2="555.0" y2="200.0" stroke="#1F3D57" stroke-width="4"/><path d="M555.0 200.0L539.0 190.4L539.0 209.6z" fill="#1F3D57"/><line x1="593.0" y1="200.0" x2="735.0" y2="200.0" stroke="#1F3D57" stroke-width="4"/><path d="M735.0 200.0L719.0 190.4L719.0 209.6z" fill="#1F3D57"/><line x1="773.0" y1="200.0" x2="900.0" y2="200.0" stroke="#1F3D57" stroke-width="4"/><path d="M900.0 200.0L884.0 190.4L884.0 209.6z" fill="#1F3D57"/><line x1="938.0" y1="200.0" x2="1060.0" y2="200.0" stroke="#1F3D57" stroke-width="4"/><path d="M1060.0 200.0L1044.0 190.4L1044.0 209.6z" fill="#1F3D57"/><circle cx="75" cy="200" r="13" fill="#1F3D57"/><text x="75" y="175" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#2A2A2A" text-anchor="middle" letter-spacing="0">sources</text><text x="75" y="235" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#8C7B5C" text-anchor="middle" letter-spacing="0">Outlook files, ICS</text><circle cx="230" cy="200" r="13" fill="#1F3D57"/><text x="230" y="175" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#2A2A2A" text-anchor="middle" letter-spacing="0">snapshot</text><text x="230" y="235" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#8C7B5C" text-anchor="middle" letter-spacing="0">private copy</text><circle cx="395" cy="200" r="13" fill="#1F3D57"/><text x="395" y="175" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#2A2A2A" text-anchor="middle" letter-spacing="0">importer</text><text x="395" y="235" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#8C7B5C" text-anchor="middle" letter-spacing="0">one per source</text><circle cx="575" cy="200" r="13" fill="#1F3D57"/><text x="575" y="175" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="16" font-weight="600" fill="#2A2A2A" text-anchor="middle" letter-spacing="0">sync.run_import</text><rect x="742" y="187" width="26" height="26" fill="#C15A3D"/><text x="755" y="175" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="16" font-weight="600" fill="#2A2A2A" text-anchor="middle" letter-spacing="0">archive.db</text><text x="755" y="235" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#8C7B5C" text-anchor="middle" letter-spacing="0">SQLite + FTS5</text><circle cx="920" cy="200" r="13" fill="#1F3D57"/><text x="920" y="175" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="16" font-weight="600" fill="#2A2A2A" text-anchor="middle" letter-spacing="0">tools</text><text x="920" y="235" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#8C7B5C" text-anchor="middle" letter-spacing="0">caltools · semantic</text><circle cx="1080" cy="200" r="13" fill="#1F3D57"/><text x="1080" y="175" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="16" font-weight="600" fill="#2A2A2A" text-anchor="middle" letter-spacing="0">server.py · cli.py</text><text x="1080" y="235" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#8C7B5C" text-anchor="middle" letter-spacing="0">MCP and command line</text><text x="395" y="262" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#8C7B5C" text-anchor="middle" letter-spacing="0">yields MessageRecord, EventRecord</text><rect x="573" y="232" width="4" height="232" fill="#1F3D57"/><rect x="577" y="260" width="34" height="4" fill="#1F3D57"/><circle cx="619" cy="262" r="7" fill="#C15A3D"/><text x="637" y="267" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="15" font-weight="600" fill="#2A2A2A" text-anchor="start" letter-spacing="0">privacy filter</text><text x="779.8" y="267" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#8C7B5C" text-anchor="start" letter-spacing="0">drop excluded records</text><rect x="577" y="308" width="34" height="4" fill="#1F3D57"/><circle cx="619" cy="310" r="7" fill="#1F3D57"/><text x="637" y="315" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="15" font-weight="600" fill="#2A2A2A" text-anchor="start" letter-spacing="0">Archive.upsert</text><text x="779.8" y="315" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#8C7B5C" text-anchor="start" letter-spacing="0">dedup and merge</text><rect x="577" y="356" width="34" height="4" fill="#1F3D57"/><circle cx="619" cy="358" r="7" fill="#1F3D57"/><text x="637" y="363" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="15" font-weight="600" fill="#2A2A2A" text-anchor="start" letter-spacing="0">finish_files, finish_events</text><text x="899.4" y="363" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#8C7B5C" text-anchor="start" letter-spacing="0">orphan files, feed pruning</text><rect x="577" y="404" width="34" height="4" fill="#1F3D57"/><circle cx="619" cy="406" r="7" fill="#1F3D57"/><text x="637" y="411" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="15" font-weight="600" fill="#2A2A2A" text-anchor="start" letter-spacing="0">rebuild_instances</text><text x="807.4" y="411" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#8C7B5C" text-anchor="start" letter-spacing="0">recurrence expansion</text><rect x="577" y="452" width="34" height="4" fill="#1F3D57"/><circle cx="619" cy="454" r="7" fill="#1F3D57"/><text x="637" y="459" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="15" font-weight="600" fill="#2A2A2A" text-anchor="start" letter-spacing="0">embed new mail</text><text x="779.8" y="459" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#8C7B5C" text-anchor="start" letter-spacing="0">if search by meaning is set up</text><text x="46" y="530" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A2A2A" text-anchor="start" letter-spacing="0">Triggers: new-outlook sync, the sync_now tool, the watcher, and the 36-hour LaunchAgent.</text></svg>
