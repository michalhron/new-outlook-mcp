<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 468" width="1200" height="468" role="img" aria-label="Calendar merge and recurrence expansion"><title>Calendar merge and recurrence expansion</title><rect width="1200" height="468" fill="#F3EFE3"/><rect x="48" y="39" width="14" height="14" fill="#C15A3D"/><text x="74" y="52" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#8C7B5C" text-anchor="start" letter-spacing="3.5">CALENDAR</text><text x="46" y="100" font-family="'Source Serif 4','Source Serif Pro',Georgia,serif" font-size="32" font-weight="700" fill="#1F3D57" text-anchor="start" letter-spacing="0">One event per UID, expanded into occurrences.</text><circle cx="210" cy="190" r="11" fill="#1F3D57"/><text x="186" y="195" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#2A2A2A" text-anchor="end" letter-spacing="0">New Outlook</text><text x="186" y="214" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#8C7B5C" text-anchor="end" letter-spacing="0">priority 1</text><line x1="226" y1="190" x2="404" y2="260" stroke="#1F3D57" stroke-width="3"/><circle cx="210" cy="260" r="11" fill="#1F3D57"/><text x="186" y="265" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#2A2A2A" text-anchor="end" letter-spacing="0">ICS feed</text><text x="186" y="284" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#8C7B5C" text-anchor="end" letter-spacing="0">priority 2</text><line x1="226" y1="260" x2="404" y2="260" stroke="#98AAB9" stroke-width="3"/><circle cx="210" cy="330" r="11" fill="#1F3D57"/><text x="186" y="335" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#2A2A2A" text-anchor="end" letter-spacing="0">Legacy archive</text><text x="186" y="354" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#8C7B5C" text-anchor="end" letter-spacing="0">priority 3</text><line x1="226" y1="330" x2="404" y2="260" stroke="#98AAB9" stroke-width="3"/><rect x="404" y="244" width="32" height="32" fill="#C15A3D"/><text x="420" y="228" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#2A2A2A" text-anchor="middle" letter-spacing="0">merged by UID</text><text x="420" y="300" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#8C7B5C" text-anchor="middle" letter-spacing="0">higher priority wins</text><line x1="452" y1="260" x2="560" y2="260" stroke="#1F3D57" stroke-width="5"/><path d="M560 260L540.0 248.0L540.0 272.0z" fill="#1F3D57"/><rect x="580" y="140" width="584" height="250" fill="#FAF7EF" stroke="none" stroke-width="2.5"/><text x="596" y="166" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#8C7B5C" text-anchor="start" letter-spacing="3">WEEKLY SERIES, EXPANDED IN ITS OWN TIMEZONE</text><text x="620" y="196" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#8C7B5C" text-anchor="middle" letter-spacing="0">week 1</text><circle cx="620" cy="250" r="10" fill="#1F3D57"/><text x="696" y="196" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#8C7B5C" text-anchor="middle" letter-spacing="0">week 2</text><circle cx="696" cy="250" r="10" fill="#1F3D57"/><text x="772" y="196" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#8C7B5C" text-anchor="middle" letter-spacing="0">week 3</text><circle cx="772" cy="250" r="10" fill="#1F3D57"/><text x="848" y="196" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#8C7B5C" text-anchor="middle" letter-spacing="0">week 4</text><circle cx="848" cy="250" r="8" fill="#FAF7EF" stroke="#8C7B5C" stroke-width="2.2"/><rect x="854" y="276" width="22" height="22" fill="#C15A3D"/><line x1="856" y1="256" x2="862" y2="274" stroke="#C15A3D" stroke-width="2"/><text x="924" y="196" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#8C7B5C" text-anchor="middle" letter-spacing="0">week 5</text><circle cx="924" cy="250" r="10" fill="#1F3D57"/><text x="1000" y="196" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#8C7B5C" text-anchor="middle" letter-spacing="0">week 6</text><circle cx="1000" cy="250" r="8" fill="#FAF7EF" stroke="#8C7B5C" stroke-width="2.2"/><line x1="992" y1="242" x2="1008" y2="258" stroke="#C15A3D" stroke-width="3"/><text x="1076" y="196" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#8C7B5C" text-anchor="middle" letter-spacing="0">week 7</text><circle cx="1076" cy="250" r="10" fill="#1F3D57"/><text x="848" y="330" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#C15A3D" text-anchor="middle" letter-spacing="0">moved occurrence</text><text x="1000" y="330" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#C15A3D" text-anchor="middle" letter-spacing="0">cancelled date</text><text x="46" y="440" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A2A2A" text-anchor="start" letter-spacing="0">A modified occurrence is stored as its own event and replaces the regular one on that day. Times hold across daylight saving changes.</text></svg>
