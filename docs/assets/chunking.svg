<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550" width="1200" height="550" role="img" aria-label="How a message becomes chunks"><title>How a message becomes chunks</title><rect width="1200" height="550" fill="#F3EFE3"/><rect x="48" y="39" width="14" height="14" fill="#C15A3D"/><text x="74" y="52" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#8C7B5C" text-anchor="start" letter-spacing="3.5">CHUNKING</text><text x="46" y="100" font-family="'Source Serif 4','Source Serif Pro',Georgia,serif" font-size="32" font-weight="700" fill="#1F3D57" text-anchor="start" letter-spacing="0">Keep what the author wrote. Cut it into passages.</text><rect x="36" y="130" width="570" height="330" fill="#FAF7EF" stroke="none" stroke-width="2.5"/><text x="52" y="156" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#8C7B5C" text-anchor="start" letter-spacing="3">ONE MAIL BODY</text><rect x="60" y="172" width="380" height="8" fill="#1F3D57"/><rect x="60" y="188" width="360" height="8" fill="#1F3D57"/><rect x="60" y="204" width="340" height="8" fill="#1F3D57"/><rect x="60" y="230" width="370" height="8" fill="#1F3D57"/><rect x="60" y="246" width="240" height="8" fill="#1F3D57"/><text x="60" y="290" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#8C7B5C" text-anchor="start" letter-spacing="0" font-style="italic">On Monday, a colleague wrote:</text><rect x="76" y="304" width="350" height="8" fill="#98AAB9"/><rect x="76" y="320" width="330" height="8" fill="#98AAB9"/><rect x="76" y="336" width="280" height="8" fill="#98AAB9"/><text x="60" y="313" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#8C7B5C" text-anchor="start" letter-spacing="0">&gt;</text><text x="60" y="374" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#8C7B5C" text-anchor="start" letter-spacing="0" font-style="italic">Best regards</text><rect x="60" y="386" width="160" height="8" fill="#98AAB9"/><rect x="60" y="402" width="220" height="8" fill="#98AAB9"/><rect x="456" y="168" width="4" height="88" fill="#C15A3D"/><text x="468" y="217.0" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#C15A3D" text-anchor="start" letter-spacing="0">kept</text><rect x="456" y="274" width="4" height="74" fill="#8C7B5C"/><text x="468" y="316.0" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#8C7B5C" text-anchor="start" letter-spacing="0">quote, dropped</text><rect x="456" y="360" width="4" height="50" fill="#8C7B5C"/><text x="468" y="390.0" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#8C7B5C" text-anchor="start" letter-spacing="0">signature, dropped</text><line x1="616" y1="295" x2="664" y2="295" stroke="#1F3D57" stroke-width="5"/><path d="M664 295L644.0 283.0L644.0 307.0z" fill="#1F3D57"/><rect x="680" y="130" width="484" height="330" fill="#FAF7EF" stroke="none" stroke-width="2.5"/><text x="696" y="156" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#8C7B5C" text-anchor="start" letter-spacing="3">CHUNKS THAT GET EMBEDDED</text><rect x="688" y="170" width="456" height="40" fill="none" stroke="#1F3D57" stroke-width="2"/><text x="704" y="196" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1F3D57" text-anchor="start" letter-spacing="0">subject  ·  its own chunk</text><rect x="688" y="226" width="456" height="62" fill="none" stroke="#1F3D57" stroke-width="2"/><rect x="704" y="240" width="420" height="8" fill="#1F3D57"/><rect x="704" y="256" width="400" height="8" fill="#1F3D57"/><rect x="704" y="272" width="300" height="8" fill="#C15A3D"/><rect x="688" y="304" width="456" height="62" fill="none" stroke="#1F3D57" stroke-width="2"/><rect x="704" y="318" width="300" height="8" fill="#C15A3D"/><rect x="704" y="334" width="410" height="8" fill="#1F3D57"/><rect x="704" y="350" width="260" height="8" fill="#1F3D57"/><text x="1016" y="280" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#C15A3D" text-anchor="start" letter-spacing="0">overlap</text><rect x="688" y="382" width="456" height="62" fill="none" stroke="#1F3D57" stroke-width="2" stroke-dasharray="6 5"/><text x="704" y="406" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="14" font-weight="600" fill="#8C7B5C" text-anchor="start" letter-spacing="0">report.pdf</text><rect x="704" y="418" width="400" height="8" fill="#1F3D57"/><rect x="704" y="434" width="340" height="8" fill="#1F3D57"/><text x="46" y="498" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A2A2A" text-anchor="start" letter-spacing="0">Body chunks hold about 700 and at most 1,000 characters. A short last paragraph repeats at the start of the next chunk.</text><text x="46" y="522" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A2A2A" text-anchor="start" letter-spacing="0">Attachment chunks carry the file name. Patterns cover English, Czech, German, French, Spanish, Italian, Danish, Dutch and Finnish.</text></svg>
