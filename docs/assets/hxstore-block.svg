<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 444" width="1200" height="444" role="img" aria-label="Layout of one HxStore block"><title>Layout of one HxStore block</title><rect width="1200" height="444" fill="#F3EFE3"/><rect x="48" y="39" width="14" height="14" fill="#C15A3D"/><text x="74" y="52" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#8C7B5C" text-anchor="start" letter-spacing="3.5">HXSTORE BLOCK</text><text x="46" y="100" font-family="'Source Serif 4','Source Serif Pro',Georgia,serif" font-size="32" font-weight="700" fill="#1F3D57" text-anchor="start" letter-spacing="0">A CRC-checked header, a key and an LZ4 payload.</text><rect x="60" y="190" width="53" height="56" fill="#C15A3D"/><text x="86.5" y="224" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#FAF7EF" text-anchor="middle" letter-spacing="0">CRC</text><rect x="116" y="190" width="53" height="56" fill="#C15A3D"/><text x="142.5" y="224" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#FAF7EF" text-anchor="middle" letter-spacing="0">CRC</text><rect x="172" y="190" width="109" height="56" fill="#1F3D57"/><text x="226.5" y="224" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#FAF7EF" text-anchor="middle" letter-spacing="0">magic</text><rect x="284" y="190" width="53" height="56" fill="#98AAB9"/><text x="310.5" y="224" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#FAF7EF" text-anchor="middle" letter-spacing="0">key len</text><rect x="340" y="190" width="53" height="56" fill="#98AAB9"/><text x="366.5" y="224" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#FAF7EF" text-anchor="middle" letter-spacing="0">comp</text><rect x="396" y="190" width="53" height="56" fill="#98AAB9"/><text x="422.5" y="224" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#FAF7EF" text-anchor="middle" letter-spacing="0">infl</text><rect x="452" y="190" width="53" height="56" fill="#98AAB9"/><text x="478.5" y="224" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#FAF7EF" text-anchor="middle" letter-spacing="0">codec</text><rect x="508" y="190" width="109" height="56" fill="#1F3D57"/><text x="562.5" y="224" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#FAF7EF" text-anchor="middle" letter-spacing="0">key</text><rect x="620" y="190" width="520" height="56" fill="none" stroke="#1F3D57" stroke-width="2.5" stroke-dasharray="7 6"/><text x="880.0" y="224" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1F3D57" text-anchor="middle" letter-spacing="0">LZ4 payload  ·  compressed length bytes</text><text x="60" y="178" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#8C7B5C" text-anchor="start" letter-spacing="0">+0x00</text><text x="116" y="178" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#8C7B5C" text-anchor="start" letter-spacing="0">+0x04</text><text x="172" y="178" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#8C7B5C" text-anchor="start" letter-spacing="0">+0x08</text><text x="284" y="178" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#8C7B5C" text-anchor="start" letter-spacing="0">+0x10</text><text x="508" y="178" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#8C7B5C" text-anchor="start" letter-spacing="0">+0x20</text><path d="M116 270 V280 H505 V270" fill="none" stroke="#C15A3D" stroke-width="2.5"/><text x="116" y="304" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#C15A3D" text-anchor="start" letter-spacing="0">first CRC-32 covers bytes 0x04 to 0x20</text><path d="M172 330 V340 H1140 V330" fill="none" stroke="#1F3D57" stroke-width="2.5"/><text x="172" y="364" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#1F3D57" text-anchor="start" letter-spacing="0">second CRC-32 covers the magic, the key and the payload</text><text x="46" y="416" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A2A2A" text-anchor="start" letter-spacing="0">Header length is 0x20 plus the key length (8 or 16 bytes). Blocks start on 512-byte boundaries. Codec 4 is raw LZ4.</text></svg>
