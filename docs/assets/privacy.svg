<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="How privacy rules apply"><title>How privacy rules apply</title><rect width="1200" height="460" fill="#F3EFE3"/><rect x="48" y="39" width="14" height="14" fill="#C15A3D"/><text x="74" y="52" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#8C7B5C" text-anchor="start" letter-spacing="3.5">PRIVACY SCOPES</text><text x="46" y="100" font-family="'Source Serif 4','Source Serif Pro',Georgia,serif" font-size="32" font-weight="700" fill="#1F3D57" text-anchor="start" letter-spacing="0">Excluded mail is filtered twice and can be purged.</text><rect x="36" y="130" width="1128" height="300" fill="#FAF7EF" stroke="none" stroke-width="2.5"/><text x="52" y="156" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#8C7B5C" text-anchor="start" letter-spacing="3"></text><line x1="128.0" y1="240.0" x2="310.0" y2="240.0" stroke="#1F3D57" stroke-width="4"/><path d="M310.0 240.0L294.0 230.4L294.0 249.6z" fill="#1F3D57"/><line x1="348.0" y1="240.0" x2="540.0" y2="240.0" stroke="#1F3D57" stroke-width="4"/><path d="M540.0 240.0L524.0 230.4L524.0 249.6z" fill="#1F3D57"/><line x1="578.0" y1="240.0" x2="770.0" y2="240.0" stroke="#1F3D57" stroke-width="4"/><path d="M770.0 240.0L754.0 230.4L754.0 249.6z" fill="#1F3D57"/><line x1="808.0" y1="240.0" x2="990.0" y2="240.0" stroke="#1F3D57" stroke-width="4"/><path d="M990.0 240.0L974.0 230.4L974.0 249.6z" fill="#1F3D57"/><circle cx="110" cy="240" r="13" fill="#1F3D57"/><text x="110" y="215" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#2A2A2A" text-anchor="middle" letter-spacing="0">Outlook</text><text x="110" y="275" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#8C7B5C" text-anchor="middle" letter-spacing="0">mail and events</text><rect x="326" y="196" width="8" height="88" fill="none"/><line x1="330" y1="196" x2="330" y2="288" stroke="#1F3D57" stroke-width="3" stroke-dasharray="7 6"/><text x="330" y="160" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#2A2A2A" text-anchor="middle" letter-spacing="0">Import filter</text><text x="330" y="180" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#8C7B5C" text-anchor="middle" letter-spacing="0">rules at sync time</text><rect x="547" y="227" width="26" height="26" fill="#C15A3D"/><text x="560" y="215" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="17" font-weight="600" fill="#2A2A2A" text-anchor="middle" letter-spacing="0">archive.db</text><rect x="786" y="196" width="8" height="88" fill="none"/><line x1="790" y1="196" x2="790" y2="288" stroke="#1F3D57" stroke-width="3" stroke-dasharray="7 6"/><text x="790" y="160" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#2A2A2A" text-anchor="middle" letter-spacing="0">Query filter</text><text x="790" y="180" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#8C7B5C" text-anchor="middle" letter-spacing="0">rules at every call</text><circle cx="1010" cy="240" r="13" fill="#1F3D57"/><text x="1010" y="215" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#2A2A2A" text-anchor="middle" letter-spacing="0">Tools</text><text x="1010" y="275" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#8C7B5C" text-anchor="middle" letter-spacing="0">what Claude can see</text><circle cx="370" cy="330" r="8" fill="#FAF7EF" stroke="#8C7B5C" stroke-width="2.2"/><line x1="362" y1="322" x2="378" y2="338" stroke="#C15A3D" stroke-width="3"/><line x1="340" y1="262" x2="366" y2="318" stroke="#C15A3D" stroke-width="2.5"/><text x="394" y="336" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#C15A3D" text-anchor="start" letter-spacing="0">dropped, never stored</text><circle cx="830" cy="330" r="8" fill="#FAF7EF" stroke="#8C7B5C" stroke-width="2.2"/><line x1="822" y1="322" x2="838" y2="338" stroke="#C15A3D" stroke-width="3"/><line x1="800" y1="262" x2="826" y2="318" stroke="#C15A3D" stroke-width="2.5"/><text x="854" y="336" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#C15A3D" text-anchor="start" letter-spacing="0">hidden at once, for rules added later</text><path d="M560 268 V392 H640" fill="none" stroke="#1F3D57" stroke-width="3" stroke-dasharray="7 6"/><text x="652" y="398" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#1F3D57" text-anchor="start" letter-spacing="0">purge-excluded deletes stored matches, with their chunks and vectors</text></svg>
