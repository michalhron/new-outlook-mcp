<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 494" width="1200" height="494" role="img" aria-label="Work and private realms"><title>Work and private realms</title><rect width="1200" height="494" fill="#F3EFE3"/><rect x="48" y="39" width="14" height="14" fill="#C15A3D"/><text x="74" y="52" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#8C7B5C" text-anchor="start" letter-spacing="3.5">WORK AND PRIVATE</text><text x="46" y="100" font-family="'Source Serif 4','Source Serif Pro',Georgia,serif" font-size="32" font-weight="700" fill="#1F3D57" text-anchor="start" letter-spacing="0">One archive. Work by default, private on request.</text><rect x="36" y="130" width="1128" height="270" fill="#FAF7EF" stroke="none" stroke-width="2.5"/><text x="52" y="156" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#8C7B5C" text-anchor="start" letter-spacing="3"></text><circle cx="330" cy="205" r="14" fill="#1F3D57"/><text x="300" y="200" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#2A2A2A" text-anchor="end" letter-spacing="0">Outlook</text><text x="300" y="222" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#8C7B5C" text-anchor="end" letter-spacing="0">work</text><circle cx="330" cy="315" r="11" fill="#FAF7EF" stroke="#8C7B5C" stroke-width="2.2"/><text x="300" y="310" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#2A2A2A" text-anchor="end" letter-spacing="0">HEY, via mcp-hey</text><text x="300" y="332" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#8C7B5C" text-anchor="end" letter-spacing="0">private  ·  only what you read</text><line x1="353.2169333611259" y1="211.0806254041044" x2="514.8483221921136" y2="253.41265581222024" stroke="#1F3D57" stroke-width="4"/><path d="M514.8483221921136 253.41265581222024L501.8 240.1L496.9 258.6z" fill="#1F3D57"/><line x1="353.2169333611259" y1="308.9193745958956" x2="514.8483221921136" y2="266.58734418777976" stroke="#1F3D57" stroke-width="4"/><path d="M514.8483221921136 266.58734418777976L496.9 261.4L501.8 279.9z" fill="#1F3D57"/><rect x="526" y="246" width="28" height="28" fill="#C15A3D"/><text x="540" y="230" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="16" font-weight="600" fill="#2A2A2A" text-anchor="middle" letter-spacing="0">archive.db</text><text x="540" y="302" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#8C7B5C" text-anchor="middle" letter-spacing="0">one index</text><line x1="570" y1="260" x2="700" y2="185" stroke="#1F3D57" stroke-width="3"/><text x="720" y="190" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="15" font-weight="600" fill="#2A2A2A" text-anchor="start" letter-spacing="0">default</text><text x="720" y="210" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#8C7B5C" text-anchor="start" letter-spacing="0">work</text><circle cx="910" cy="185" r="9" fill="#1F3D57"/><circle cx="944" cy="185" r="9" fill="#1F3D57"/><circle cx="978" cy="185" r="9" fill="#1F3D57"/><circle cx="1012" cy="185" r="9" fill="#1F3D57"/><circle cx="1046" cy="185" r="9" fill="#1F3D57"/><line x1="570" y1="260" x2="700" y2="260" stroke="#98AAB9" stroke-width="3"/><text x="720" y="265" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="15" font-weight="600" fill="#2A2A2A" text-anchor="start" letter-spacing="0">realm="private"</text><text x="720" y="285" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#8C7B5C" text-anchor="start" letter-spacing="0">private</text><circle cx="910" cy="260" r="8" fill="#FAF7EF" stroke="#8C7B5C" stroke-width="2.2"/><circle cx="944" cy="260" r="8" fill="#FAF7EF" stroke="#8C7B5C" stroke-width="2.2"/><circle cx="978" cy="260" r="8" fill="#FAF7EF" stroke="#8C7B5C" stroke-width="2.2"/><line x1="570" y1="260" x2="700" y2="335" stroke="#98AAB9" stroke-width="3"/><text x="720" y="340" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="15" font-weight="600" fill="#2A2A2A" text-anchor="start" letter-spacing="0">realm="all"</text><text x="720" y="360" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#8C7B5C" text-anchor="start" letter-spacing="0">both</text><circle cx="910" cy="335" r="9" fill="#1F3D57"/><circle cx="944" cy="335" r="8" fill="#FAF7EF" stroke="#8C7B5C" stroke-width="2.2"/><circle cx="978" cy="335" r="9" fill="#1F3D57"/><circle cx="1012" cy="335" r="9" fill="#1F3D57"/><circle cx="1046" cy="335" r="8" fill="#FAF7EF" stroke="#8C7B5C" stroke-width="2.2"/><circle cx="1080" cy="335" r="9" fill="#1F3D57"/><circle cx="1114" cy="335" r="8" fill="#FAF7EF" stroke="#8C7B5C" stroke-width="2.2"/><text x="46" y="440" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A2A2A" text-anchor="start" letter-spacing="0">A server started with --realm work returns work mail only, whatever a call asks for.</text><text x="46" y="466" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A2A2A" text-anchor="start" letter-spacing="0">Accounts without a realm are hidden behind a fence and shown only when a search covers all mail.</text></svg>
