<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" width="1200" height="610" role="img" aria-label="Indexing and querying for search by meaning"><title>Indexing and querying for search by meaning</title><rect width="1200" height="610" fill="#F3EFE3"/><rect x="48" y="39" width="14" height="14" fill="#C15A3D"/><text x="74" y="52" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#8C7B5C" text-anchor="start" letter-spacing="3.5">HOW IT WORKS</text><text x="46" y="100" font-family="'Source Serif 4','Source Serif Pro',Georgia,serif" font-size="32" font-weight="700" fill="#1F3D57" text-anchor="start" letter-spacing="0">Index once. Then every question is a short lookup.</text><rect x="36" y="130" width="1128" height="170" fill="#FAF7EF" stroke="none" stroke-width="2.5"/><text x="52" y="156" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#8C7B5C" text-anchor="start" letter-spacing="3">INDEXING  ·  ONCE, THEN AFTER EACH SYNC</text><line x1="128.0" y1="220.0" x2="280.0" y2="220.0" stroke="#1F3D57" stroke-width="4"/><path d="M280.0 220.0L264.0 210.4L264.0 229.6z" fill="#1F3D57"/><line x1="318.0" y1="220.0" x2="470.0" y2="220.0" stroke="#1F3D57" stroke-width="4"/><path d="M470.0 220.0L454.0 210.4L454.0 229.6z" fill="#1F3D57"/><line x1="508.0" y1="220.0" x2="660.0" y2="220.0" stroke="#1F3D57" stroke-width="4"/><path d="M660.0 220.0L644.0 210.4L644.0 229.6z" fill="#1F3D57"/><line x1="698.0" y1="220.0" x2="850.0" y2="220.0" stroke="#1F3D57" stroke-width="4"/><path d="M850.0 220.0L834.0 210.4L834.0 229.6z" fill="#1F3D57"/><line x1="888.0" y1="220.0" x2="1040.0" y2="220.0" stroke="#1F3D57" stroke-width="4"/><path d="M1040.0 220.0L1024.0 210.4L1024.0 229.6z" fill="#1F3D57"/><circle cx="110" cy="220" r="13" fill="#1F3D57"/><text x="110" y="195" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#2A2A2A" text-anchor="middle" letter-spacing="0">Message</text><circle cx="300" cy="220" r="13" fill="#1F3D57"/><text x="300" y="195" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#2A2A2A" text-anchor="middle" letter-spacing="0">Parts</text><text x="300" y="255" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#8C7B5C" text-anchor="middle" letter-spacing="0">subject · body · attachments</text><circle cx="490" cy="220" r="13" fill="#1F3D57"/><text x="490" y="195" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#2A2A2A" text-anchor="middle" letter-spacing="0">Clean</text><text x="490" y="255" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#8C7B5C" text-anchor="middle" letter-spacing="0">quotes, signatures out</text><circle cx="680" cy="220" r="13" fill="#1F3D57"/><text x="680" y="195" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#2A2A2A" text-anchor="middle" letter-spacing="0">Chunks</text><text x="680" y="255" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#8C7B5C" text-anchor="middle" letter-spacing="0">about 700 characters</text><circle cx="870" cy="220" r="13" fill="#1F3D57"/><text x="870" y="195" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#2A2A2A" text-anchor="middle" letter-spacing="0">Model</text><text x="870" y="255" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#8C7B5C" text-anchor="middle" letter-spacing="0">passage: …</text><rect x="1047" y="207" width="26" height="26" fill="#C15A3D"/><text x="1060" y="195" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#2A2A2A" text-anchor="middle" letter-spacing="0">Vectors</text><text x="1060" y="255" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#8C7B5C" text-anchor="middle" letter-spacing="0">in archive.db</text><rect x="36" y="320" width="1128" height="260" fill="#FAF7EF" stroke="none" stroke-width="2.5"/><text x="52" y="346" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#8C7B5C" text-anchor="start" letter-spacing="3">QUERYING  ·  EVERY SEARCH</text><circle cx="110" cy="455" r="13" fill="#1F3D57"/><text x="110" y="430" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#2A2A2A" text-anchor="middle" letter-spacing="0">Question</text><line x1="127.2901567594621" y1="449.994954622261" x2="280.7887147117088" y2="405.56116153082115" stroke="#1F3D57" stroke-width="4"/><path d="M280.7887147117088 405.56116153082115L262.8 400.8L268.1 419.2z" fill="#1F3D57"/><line x1="318.0" y1="400.0" x2="470.0" y2="400.0" stroke="#1F3D57" stroke-width="4"/><path d="M470.0 400.0L454.0 390.4L454.0 409.6z" fill="#1F3D57"/><line x1="508.0" y1="400.0" x2="660.0" y2="400.0" stroke="#1F3D57" stroke-width="4"/><path d="M660.0 400.0L644.0 390.4L644.0 409.6z" fill="#1F3D57"/><line x1="698.0" y1="400.0" x2="850.0" y2="400.0" stroke="#1F3D57" stroke-width="4"/><path d="M850.0 400.0L834.0 390.4L834.0 409.6z" fill="#1F3D57"/><line x1="127.2901567594621" y1="460.005045377739" x2="280.7887147117088" y2="504.43883846917885" stroke="#1F3D57" stroke-width="4"/><path d="M280.7887147117088 504.43883846917885L268.1 490.8L262.8 509.2z" fill="#1F3D57"/><line x1="318.0" y1="510.0" x2="470.0" y2="510.0" stroke="#1F3D57" stroke-width="4"/><path d="M470.0 510.0L454.0 500.4L454.0 519.6z" fill="#1F3D57"/><line x1="508.0" y1="510.0" x2="850.0" y2="510.0" stroke="#1F3D57" stroke-width="4"/><path d="M850.0 510.0L834.0 500.4L834.0 519.6z" fill="#1F3D57"/><circle cx="300" cy="400" r="13" fill="#1F3D57"/><text x="300" y="375" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#2A2A2A" text-anchor="middle" letter-spacing="0">Model</text><text x="300" y="435" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#8C7B5C" text-anchor="middle" letter-spacing="0">query: …</text><circle cx="490" cy="400" r="13" fill="#1F3D57"/><text x="490" y="375" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#2A2A2A" text-anchor="middle" letter-spacing="0">Nearest chunks</text><text x="490" y="435" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#8C7B5C" text-anchor="middle" letter-spacing="0">cosine similarity</text><circle cx="680" cy="400" r="13" fill="#1F3D57"/><text x="680" y="375" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#2A2A2A" text-anchor="middle" letter-spacing="0">Best per message</text><text x="680" y="435" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#8C7B5C" text-anchor="middle" letter-spacing="0">its passage is the snippet</text><circle cx="870" cy="400" r="13" fill="#1F3D57"/><text x="870" y="375" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#2A2A2A" text-anchor="middle" letter-spacing="0">Filters</text><text x="870" y="435" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#8C7B5C" text-anchor="middle" letter-spacing="0">and privacy rules</text><circle cx="300" cy="510" r="13" fill="#1F3D57"/><text x="300" y="485" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#2A2A2A" text-anchor="middle" letter-spacing="0">Keyword query</text><text x="300" y="545" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#8C7B5C" text-anchor="middle" letter-spacing="0">OR of the words</text><circle cx="490" cy="510" r="13" fill="#1F3D57"/><text x="490" y="485" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#2A2A2A" text-anchor="middle" letter-spacing="0">bm25 ranking</text><text x="490" y="545" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#8C7B5C" text-anchor="middle" letter-spacing="0">full-text index</text><circle cx="870" cy="510" r="13" fill="#1F3D57"/><text x="870" y="485" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#2A2A2A" text-anchor="middle" letter-spacing="0">Filters</text><text x="870" y="545" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#8C7B5C" text-anchor="middle" letter-spacing="0">and privacy rules</text><line x1="886.7535268819263" y1="406.5817427036139" x2="991.3849701311931" y2="447.6869525515401" stroke="#1F3D57" stroke-width="4"/><path d="M991.3849701311931 447.6869525515401L980.0 432.9L973.0 450.8z" fill="#1F3D57"/><line x1="886.7535268819263" y1="503.4182572963861" x2="991.3849701311931" y2="462.3130474484599" stroke="#1F3D57" stroke-width="4"/><path d="M991.3849701311931 462.3130474484599L973.0 459.2L980.0 477.1z" fill="#1F3D57"/><rect x="997" y="442" width="26" height="26" fill="#C15A3D"/><text x="1010" y="430" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#2A2A2A" text-anchor="middle" letter-spacing="0">Fusion</text><text x="1010" y="490" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#8C7B5C" text-anchor="middle" letter-spacing="0">RRF</text><line x1="1028.0" y1="455.0" x2="1090.0" y2="455.0" stroke="#1F3D57" stroke-width="4"/><path d="M1090.0 455.0L1074.0 445.4L1074.0 464.6z" fill="#1F3D57"/><circle cx="1110" cy="455" r="13" fill="#1F3D57"/><text x="1110" y="430" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#2A2A2A" text-anchor="middle" letter-spacing="0">Results</text></svg>
