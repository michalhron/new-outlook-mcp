<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="How search by meaning works"><title>How search by meaning works</title><rect width="1200" height="470" fill="#F3EFE3"/><rect x="48" y="39" width="14" height="14" fill="#C15A3D"/><text x="74" y="52" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#8C7B5C" text-anchor="start" letter-spacing="3.5">SEARCH BY MEANING</text><text x="46" y="100" font-family="'Source Serif 4','Source Serif Pro',Georgia,serif" font-size="32" font-weight="700" fill="#1F3D57" text-anchor="start" letter-spacing="0">Describe the message. Search finds it by meaning.</text><rect x="36" y="130" width="344" height="250" fill="#FAF7EF" stroke="none" stroke-width="2.5"/><text x="54" y="160" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#8C7B5C" text-anchor="start" letter-spacing="3">STEP 1 OF 3</text><text x="54" y="190" font-family="'Source Serif 4','Source Serif Pro',Georgia,serif" font-size="22" font-weight="700" fill="#1F3D57" text-anchor="start" letter-spacing="0">Nearest passages</text><text x="54" y="410" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A2A2A" text-anchor="start" letter-spacing="0">Your question lands near passages</text><text x="54" y="432" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A2A2A" text-anchor="start" letter-spacing="0">with the same meaning.</text><rect x="428" y="130" width="344" height="250" fill="#FAF7EF" stroke="none" stroke-width="2.5"/><text x="446" y="160" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#8C7B5C" text-anchor="start" letter-spacing="3">STEP 2 OF 3</text><text x="446" y="190" font-family="'Source Serif 4','Source Serif Pro',Georgia,serif" font-size="22" font-weight="700" fill="#1F3D57" text-anchor="start" letter-spacing="0">Two rankings</text><text x="446" y="410" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A2A2A" text-anchor="start" letter-spacing="0">Meaning and keywords rank</text><text x="446" y="432" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A2A2A" text-anchor="start" letter-spacing="0">messages on their own.</text><rect x="820" y="130" width="344" height="250" fill="#FAF7EF" stroke="none" stroke-width="2.5"/><text x="838" y="160" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#8C7B5C" text-anchor="start" letter-spacing="3">STEP 3 OF 3</text><text x="838" y="190" font-family="'Source Serif 4','Source Serif Pro',Georgia,serif" font-size="22" font-weight="700" fill="#1F3D57" text-anchor="start" letter-spacing="0">One list</text><text x="838" y="410" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A2A2A" text-anchor="start" letter-spacing="0">Messages both agree on rise.</text><text x="838" y="432" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A2A2A" text-anchor="start" letter-spacing="0">Each shows its best passage.</text><circle cx="208" cy="290" r="62" fill="none" stroke="#1F3D57" stroke-width="2.5" stroke-dasharray="7 6"/><circle cx="174" cy="264" r="8" fill="#1F3D57"/><circle cx="238" cy="254" r="8" fill="#1F3D57"/><circle cx="246" cy="312" r="8" fill="#1F3D57"/><circle cx="180" cy="324" r="8" fill="#1F3D57"/><circle cx="212" cy="336" r="8" fill="#1F3D57"/><circle cx="78" cy="230" r="7" fill="#FAF7EF" stroke="#8C7B5C" stroke-width="2.2"/><circle cx="328" cy="220" r="7" fill="#FAF7EF" stroke="#8C7B5C" stroke-width="2.2"/><circle cx="348" cy="330" r="7" fill="#FAF7EF" stroke="#8C7B5C" stroke-width="2.2"/><circle cx="68" cy="340" r="7" fill="#FAF7EF" stroke="#8C7B5C" stroke-width="2.2"/><circle cx="118" cy="362" r="7" fill="#FAF7EF" stroke="#8C7B5C" stroke-width="2.2"/><circle cx="308" cy="364" r="7" fill="#FAF7EF" stroke="#8C7B5C" stroke-width="2.2"/><rect x="199" y="281" width="18" height="18" fill="#C15A3D"/><text x="520" y="218" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#8C7B5C" text-anchor="middle" letter-spacing="0">meaning</text><text x="700" y="218" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#8C7B5C" text-anchor="middle" letter-spacing="0">keywords</text><circle cx="520" cy="248" r="8" fill="#1F3D57"/><rect x="692" y="240" width="16" height="16" fill="#1F3D57"/><circle cx="520" cy="276" r="8" fill="#1F3D57"/><rect x="692" y="268" width="16" height="16" fill="#1F3D57"/><circle cx="520" cy="304" r="8" fill="#1F3D57"/><rect x="692" y="296" width="16" height="16" fill="#1F3D57"/><circle cx="520" cy="332" r="8" fill="#1F3D57"/><rect x="692" y="324" width="16" height="16" fill="#1F3D57"/><circle cx="520" cy="360" r="8" fill="#1F3D57"/><rect x="692" y="352" width="16" height="16" fill="#1F3D57"/><line x1="532" y1="248" x2="688" y2="304" stroke="#98AAB9" stroke-width="3"/><line x1="532" y1="304" x2="688" y2="248" stroke="#98AAB9" stroke-width="3"/><rect x="852" y="240" width="16" height="16" fill="#C15A3D"/><rect x="882" y="244" width="220" height="8" fill="#1F3D57"/><rect x="852" y="268" width="16" height="16" fill="#C15A3D"/><rect x="882" y="272" width="190" height="8" fill="#1F3D57"/><circle cx="860" cy="304" r="8" fill="#1F3D57"/><rect x="882" y="300" width="160" height="8" fill="#98AAB9"/><circle cx="860" cy="332" r="8" fill="#1F3D57"/><rect x="882" y="328" width="130" height="8" fill="#98AAB9"/><circle cx="860" cy="360" r="8" fill="#1F3D57"/><rect x="882" y="356" width="100" height="8" fill="#98AAB9"/><line x1="380" y1="290" x2="420" y2="290" stroke="#1F3D57" stroke-width="4"/><path d="M420 290L404.0 280.4L404.0 299.6z" fill="#1F3D57"/><line x1="772" y1="290" x2="812" y2="290" stroke="#1F3D57" stroke-width="4"/><path d="M812 290L796.0 280.4L796.0 299.6z" fill="#1F3D57"/></svg>
