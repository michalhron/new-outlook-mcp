<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 512" width="1200" height="512" role="img" aria-label="Watcher timing"><title>Watcher timing</title><rect width="1200" height="512" fill="#F3EFE3"/><rect x="48" y="39" width="14" height="14" fill="#C15A3D"/><text x="74" y="52" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#8C7B5C" text-anchor="start" letter-spacing="3.5">NEAR-LIVE SYNC</text><text x="46" y="100" font-family="'Source Serif 4','Source Serif Pro',Georgia,serif" font-size="32" font-weight="700" fill="#1F3D57" text-anchor="start" letter-spacing="0">Wait for Outlook to go quiet, then sync.</text><text x="80.0" y="168" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#8C7B5C" text-anchor="start" letter-spacing="3">OUTLOOK WRITES</text><rect x="90.0" y="182" width="4" height="34" fill="#8C7B5C"/><rect x="102.0" y="182" width="4" height="34" fill="#8C7B5C"/><rect x="120.0" y="182" width="4" height="34" fill="#8C7B5C"/><rect x="132.0" y="182" width="4" height="34" fill="#8C7B5C"/><rect x="438.0" y="182" width="4" height="34" fill="#8C7B5C"/><rect x="456.0" y="182" width="4" height="34" fill="#8C7B5C"/><rect x="474.0" y="182" width="4" height="34" fill="#8C7B5C"/><rect x="822.0" y="182" width="4" height="34" fill="#8C7B5C"/><rect x="840.0" y="182" width="4" height="34" fill="#8C7B5C"/><text x="80.0" y="268" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#8C7B5C" text-anchor="start" letter-spacing="3">SYNCS</text><rect x="254.0" y="282" width="72.0" height="34" fill="#1F3D57"/><rect x="614.0" y="282" width="72.0" height="34" fill="#1F3D57"/><rect x="974.0" y="282" width="36.0" height="34" fill="#C15A3D"/><text x="992.0" y="340" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#C15A3D" text-anchor="middle" letter-spacing="0">torn copy</text><line x1="134.0" y1="240" x2="254.0" y2="240" stroke="#1F3D57" stroke-width="2"/><line x1="134.0" y1="233" x2="134.0" y2="247" stroke="#1F3D57" stroke-width="2"/><line x1="254.0" y1="233" x2="254.0" y2="247" stroke="#1F3D57" stroke-width="2"/><text x="194.0" y="230" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#1F3D57" text-anchor="middle" letter-spacing="0">20 s quiet</text><line x1="476.0" y1="240" x2="596.0" y2="240" stroke="#1F3D57" stroke-width="2"/><line x1="476.0" y1="233" x2="476.0" y2="247" stroke="#1F3D57" stroke-width="2"/><line x1="596.0" y1="233" x2="596.0" y2="247" stroke="#1F3D57" stroke-width="2"/><text x="536.0" y="230" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#1F3D57" text-anchor="middle" letter-spacing="0">20 s quiet</text><line x1="254.0" y1="372" x2="614.0" y2="372" stroke="#1F3D57" stroke-width="2"/><line x1="254.0" y1="365" x2="254.0" y2="379" stroke="#1F3D57" stroke-width="2"/><line x1="614.0" y1="365" x2="614.0" y2="379" stroke="#1F3D57" stroke-width="2"/><text x="434.0" y="362" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#1F3D57" text-anchor="middle" letter-spacing="0">at least 60 s between sync starts</text><line x1="1010.0" y1="299" x2="1100.0" y2="299" stroke="#C15A3D" stroke-width="3" stroke-dasharray="6 5"/><text x="1016.0" y="276" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#C15A3D" text-anchor="start" letter-spacing="0">then back off 5 min</text><rect x="79.0" y="410" width="2" height="10" fill="#8C7B5C"/><text x="80.0" y="440" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#8C7B5C" text-anchor="middle" letter-spacing="0">0 s</text><rect x="259.0" y="410" width="2" height="10" fill="#8C7B5C"/><text x="260.0" y="440" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#8C7B5C" text-anchor="middle" letter-spacing="0">30 s</text><rect x="439.0" y="410" width="2" height="10" fill="#8C7B5C"/><text x="440.0" y="440" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#8C7B5C" text-anchor="middle" letter-spacing="0">60 s</text><rect x="619.0" y="410" width="2" height="10" fill="#8C7B5C"/><text x="620.0" y="440" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#8C7B5C" text-anchor="middle" letter-spacing="0">90 s</text><rect x="799.0" y="410" width="2" height="10" fill="#8C7B5C"/><text x="800.0" y="440" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#8C7B5C" text-anchor="middle" letter-spacing="0">120 s</text><rect x="979.0" y="410" width="2" height="10" fill="#8C7B5C"/><text x="980.0" y="440" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#8C7B5C" text-anchor="middle" letter-spacing="0">150 s</text><rect x="80.0" y="408" width="1020.0" height="2" fill="#8C7B5C"/><text x="46" y="486" font-family="'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A2A2A" text-anchor="start" letter-spacing="0">Each sync runs as a low-priority child process and stops after 10 minutes. A 36-hour LaunchAgent is the fallback.</text></svg>
