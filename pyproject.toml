[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "new-outlook-mcp"
version = "0.1.0"
description = "Local, read-only MCP server for Outlook for Mac email (legacy archive + New Outlook cache). No online API."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Michal Hron" }]
dependencies = [
    "mcp>=2.2,<3",
    # calendar
    "icalendar>=6",
    "python-dateutil>=2.9",
    # attachment text extraction
    "pypdf>=4",
    "python-docx>=1.1",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# Search by meaning, all on-device. The model is fetched once by `new-outlook embed --download`.
semantic = [
    "sentence-transformers>=3",
    "sqlite-vec>=0.1.6",
    "numpy>=1.26",
]
dev = ["pytest>=8", "ruff>=0.6", "numpy>=1.26", "sqlite-vec>=0.1.6"]

[project.scripts]
new-outlook = "new_outlook_mcp.cli:main"
new-outlook-mcp = "new_outlook_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/new_outlook_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: loads the real embedding model (set RUN_REAL_MODEL=1)"]
